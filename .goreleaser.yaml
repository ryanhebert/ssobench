version: 2

project_name: ssobench

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, THIRD_PARTY_NOTICES.txt]

checksum:
  name_template: checksums.txt

# A software bill of materials (SPDX) for each archive, made with syft.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
