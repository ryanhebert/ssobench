version: 2

project_name: ssobench

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

# File names carry no version, so the README can link to
# releases/latest/download/<name>. Windows gets a bare .exe to double-click;
# macOS and Linux get a .tar.gz, which keeps the executable bit.
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [binary]
    name_template: >-
      {{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}
    files: [LICENSE, README.md, THIRD_PARTY_NOTICES.txt]

checksum:
  name_template: checksums.txt

# A software bill of materials (SPDX) for each binary, made with syft.
sboms:
  - artifacts: binary
    documents:
      - '{{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}.sbom.json'

release:
  header: |
    Download the file for your system below. Windows: the `.exe`. macOS and Linux: the `.tar.gz`,
    or see the [quick start](https://github.com/ryanhebert/ssobench#quick-start) for a one-line
    command. The binaries are not code-signed yet.
  # The bare Windows binary carries no licence files, so attach them.
  extra_files:
    - glob: LICENSE
    - glob: THIRD_PARTY_NOTICES.txt

changelog:
  sort: asc
  format: "{{ .Message }}"
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
